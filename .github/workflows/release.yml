# The player downloads: BeamNG.Earth-<VERSION>-x86_64.AppImage (Linux) and BeamNG.Earth-<VERSION>.exe (Windows),
# each the launcher (launcher.py: the mod, the world server, the game started for you) with Python inside.
# A push to main whose VERSION has no release yet builds both and publishes the release v<VERSION> (a pre-release
# when the version says "preview"); "Run workflow" builds them as artifacts only (or releases with release: true).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the release v<VERSION> (when it does not exist yet)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then exists=1; else exists=0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            [ "${{ inputs.release }}" = "true" ] && [ $exists = 0 ] && pub=true || pub=false
          else
            [ $exists = 0 ] && pub=true || pub=false
            echo "build=$pub" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=$pub" >> "$GITHUB_OUTPUT"
          echo "VERSION $v, release exists: $exists, publish: $pub"

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-22.04          # an older glibc: the AppImage runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust kernels
        run: python tools/build_native.py
      - name: Grass patch (tools/gcpatch)
        run: sh tools/gcpatch/build.sh
      - name: Python packages
        run: python -m pip install pyinstaller -r server/requirements.txt
      - name: appimagetool
        run: |
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mv appimagetool appimagetool.AppImage
      - name: Build the AppImage
        run: python tools/build_app.py --appimagetool "$PWD/appimagetool.AppImage"
      - name: Smoke test (the packaged server starts and answers --help)
        run: |
          f=$(ls dist/*.AppImage)
          "$f" --appimage-extract-and-run --server --help > help.txt && head -3 help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust kernels
        run: python tools/build_native.py
      - name: Python packages
        run: python -m pip install pyinstaller -r server/requirements.txt
      # PyInstaller's bootloader compiled here (MSVC) instead of the wheel's prebuilt one that antivirus heuristics
      # know (VirusTotal 2026-10-17: 2/60 on 1.4.35); build_app.py stops without it
      - name: Bootloader from source
        run: python tools/build_bootloader.py
      - name: Build the .exe
        run: python tools/build_app.py --require-own-bootloader
      - name: Smoke test (the packaged server starts and answers --help)
        shell: bash
        run: |
          f=$(ls dist/*.exe)
          "$f" --server --help > help.txt && head -3 help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [check, linux, windows]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the fork's multiplayer files (BEAMMP.md): the server's client mod zip, the EarthSync plugin and server.bat
      - name: BeamMP files
        run: |
          python beammp/build_client_zip.py
          mkdir -p out/beammp
          cp beammp/dist/*.zip out/beammp/
          (cd beammp/Server && zip -qr ../../out/beammp/EarthSync_server_plugin.zip EarthSync)
          cp beammp/player/server.bat out/beammp/
      - name: Publish v${{ needs.check.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.check.outputs.version }}
          pre=""
          case "$v" in *preview*|*alpha*|*beta*|*rc*) pre="--prerelease";; esac
          cat > notes.md <<EOF
          BeamNG.Earth with **EarthSync** (BeamMP multiplayer) and the **RHD sign fix** (signs and signals face their
          drivers in drive-on-the-left countries). Read **BEAMMP.md** before playing on a BeamMP server.

          **Players (BeamMP):** download \`BeamNG.Earth-$v.exe\` and \`server.bat\` into one folder, delete
          \`mods\\unpacked\\beamng_earth\` in your BeamNG user folder, run \`server.bat\`, then join with the BeamMP
          launcher. Use the \`.exe\` from the same release as the server's mod zip.

          **Server owners:** \`BeamNG_Earth_*_MP.zip\` goes in \`Resources/Client/\`, the folder in
          \`EarthSync_server_plugin.zip\` in \`Resources/Server/\`, and the map is \`/levels/beamng_earth/info.json\`.

          **Single player:** run the \`.exe\` (Windows) or the AppImage (Linux) on its own, as with BeamNG.Earth.
          EOF
          gh release create "v$v" out/linux/* out/windows/* out/beammp/* --target "$GITHUB_SHA" \
            --title "BeamNG.Earth $v (EarthSync + RHD signs)" --notes-file notes.md --generate-notes $pre
